trainer:
  max_epochs: 160
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: outputs
      name: ade20k_tiny
model:
  class_path: training.mask_classification_panoptic.MaskClassificationPanoptic
  init_args:
    attn_mask_annealing_enabled: true
    attn_mask_annealing_start_steps:
    - 6520
    - 13040
    - 19560
    - 26080
    attn_mask_annealing_end_steps:
    - 13040
    - 19560
    - 26080
    - 32600
    network:
      class_path: models.ceomt3.EoMT
      init_args:
        cosine_mask_logits: false
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_tiny_patch16_224
            patch_size: 16
        lowres_mask_for_attn: true
        mask_out_stride: 4
        mask_pred_mode: token
        mask_upsample_mode: logit
        masked_attn_enabled: false
        num_blocks: 4
        num_q: 200
        token_mask_softmax: false
        token_mask_temperature: 1
    lr: 0.0001
    llrd: 0.8
    llrd_l2_enabled: true
    lr_mult: 1
    weight_decay: 0.05
    poly_power: 0.9
    warmup_steps:
    - 500
    - 1000
data:
  class_path: datasets.ade20k_panoptic.ADE20KPanoptic
  init_args:
    stuff_classes:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 9
    - 11
    - 13
    - 16
    - 17
    - 21
    - 25
    - 26
    - 28
    - 29
    - 34
    - 40
    - 46
    - 48
    - 51
    - 52
    - 54
    - 59
    - 60
    - 61
    - 63
    - 68
    - 77
    - 79
    - 84
    - 91
    - 94
    - 96
    - 99
    - 100
    - 101
    - 105
    - 106
    - 109
    - 113
    - 114
    - 117
    - 122
    - 128
    - 131
    - 140
    - 141
    - 145
    img_size:
    - 640
    - 640
    num_classes: 150
